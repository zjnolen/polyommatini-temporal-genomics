# Project specific configs (outside PopGLen pipeline)
GONE_input_params: ""
recrate: ""
gff: ""
bcf_trans: "notrans"
bcf_missing: "0.4"
calling_drop: []
call_heterozygosity: false
pixy: false
bcftools_roh: false
min_phred_roh: 30
burden: false
gerp_scores: ""
lower_gerp_thresh: 0

#=====================Dataset Configuration============================#

samples: ../config/samples_picarus_outtest.tsv

units: ../config/units_outtest.tsv

dataset: "historical-picarus-outgroup-notrans"

#===================== Reference Configuration ========================#

chunk_size: 50000000

reference:
  name: "ilPolIphe1.1"
  fasta: "../resources/ref/GCA_963422495.1_ilPolIphe1.1_genomic.fna"
  mito: ["OY730191.1"]
  sex-linked: ["OY730178.1"]
  exclude: []
  min_size: 1000000

ancestral:

#===================== Sample Set Configuration =======================#

exclude_ind: []

excl_pca-admix: ["PI031-out"]
# rels in removed pops: POIC0924

#====================== Analysis Selection ============================#

populations: []

analyses:
  # mapping options
  mapping:
    historical_only_collapsed: true
    historical_collapsed_aligner: "aln"
  # filtering
  pileup-mappability: false
  repeatmasker:
    bed:
    local_lib:
    dfam_lib:
    build_lib: true
  extreme_depth: true
  dataset_missing_data:
  population_missing_data:
  # quality control
  qualimap: false
  ibs_ref_bias: true
  damageprofiler: true
  mapdamage_rescale: false
  # population genomic analyses
  estimate_ld: false
  ld_decay: false
  pca_pcangsd: false
  admix_ngsadmix: false
  relatedness:
    ibsrelate_ibs: false
    ibsrelate_sfs: false
    ngsrelate_ibsrelate-only: false
    ngsrelate_freqbased: false
  1dsfs: false
  1dsfs_boot: false
  2dsfs: false
  2dsfs_boot: false
  thetas_angsd: false
  heterozygosity_angsd: true
  fst_angsd:
    populations: false
    individuals: false
  inbreeding_ngsf-hmm: false
  ibs_matrix: false
  pop_allele_freqs: false

#==================== Downsampling Configuration ======================#

subsample_dp: []

subsample_by: "sitefilt"
redo_depth_filts: false
drop_samples: []

subsample_analyses:
  estimate_ld: false
  ld_decay: false
  pca_pcangsd: false
  admix_ngsadmix: false
  relatedness:
    ibsrelate_ibs: false
    ibsrelate_sfs: false
    ngsrelate_ibsrelate-only: false
    ngsrelate_freqbased: false
  1dsfs: false
  1dsfs_boot: false
  2dsfs: false
  2dsfs_boot: false
  thetas_angsd: false
  heterozygosity_angsd: false
  fst_angsd:
    populations: false
    individuals: false
  inbreeding_ngsf-hmm: false
  ibs_matrix: false
  pop_allele_freqs: false

#=========================== Filter Sets ==============================#

filter_beds:
  example:

only_filter_beds: false

#===================== Software Configuration =========================#

mapQ: 30
baseQ: 20

params:
  clipoverlap:
    clip_user_provided_bams: false
  genmap:
    K: "30"
    E: "2"
    map_thresh: 1
  extreme_depth_filt:
    method: "percentile"
    bounds: [ 0.01, 0.99 ]
    filt-on-dataset: true
    filt-on-depth-classes: true
  fastp:
    merged_extra: "-p -g" # don't put --merge or --overlap_len_require here, they're implicit
    paired_extra: "-p -g"
    min_overlap_hist: 30
  bwa_aln:
    extra: "-l 16500 -n 0.01 -o 2"
  samtools:
    subsampling_seed: "$RANDOM"
  picard:
    MarkDuplicates: "--REMOVE_DUPLICATES true --OPTICAL_DUPLICATE_PIXEL_DISTANCE 2500"
  damageprofiler:
    profile_modern: false
  angsd:
    gl_model: 2 # gl_model - 1=SAMtools, 2=GATK, 3=SOAPsnp, 4=SYK
    maxdepth: 500
    mindepthind: 1
    minind_dataset: 0.9 # as a proportion of N
    minind_pop: 0.8 # as a proportion of N
    rmtrans: true
    extra: "-uniqueOnly 1"
    extra_saf: ""
    extra_beagle: ""
    domajorminor: 1 # Currently only compatible with values 1, 2, 4, 5
    domaf: 1
    snp_pval: "1e-6"
    min_maf: 0.05 # Set -1 to disable
    mindepthind_heterozygosity: 1
  ngsrelate:
    prune: false
  ngsld:
    max_kb_dist_est-ld: 4000
    rnd_sample_est-ld: 0.001
    max_kb_dist_decay: 100
    rnd_sample_decay: 0.001
    fit_LDdecay_extra: "--fit_level 100 --fit_boot 100 --plot_size 3,6 --plot_data --plot_no_legend --plot_y_lim 0.5"
    fit_LDdecay_n_correction: true
    max_kb_dist_pruning_dataset: 25 # used for PCA, Admix, NGSrelate, not ngsF-HMM
    pruning_min-weight_dataset: 0.2 # used for PCA, Admix, NGSrelate, not ngsF-HMM
  ngsf-hmm:
    estimate_in_pops: true
    prune: true
    max_kb_dist_pruning_pop: 50 # used only for ngsf-hmm
    pruning_min-weight_pop: 0.8 # used only for ngsf-hmm
    min_roh_length: 100000
    roh_bins: [ 250000, 500000, 1000000, 2500000, 5000000 ] # in ascending order, bins are between adjacent values and between min_roh_length and value 1 and the last value and infinity
  realsfs:
    fold: 0 # Should only be set to 1, unless ancestral reference is given above
    sfsboot: 1
  fst:
    whichFst: 1
    win_size: 10000
    win_step: 5000
  thetas:
    win_size: 10000
    win_step: 5000
    minsites: 1000
  ngsadmix:
    kvalues: [1,2,3,4,5,6,7,8]
    reps: 100
    minreps: 20
    thresh: 2
    conv: 3
    extra: "-maxiter 4000"
  ibs:
    doibs: 1